<header class="public-header" [class.is-scrolled]="isScrolled" role="banner">
  <div class="container-fluid flex items-center justify-between">
    <!-- Brand Wordmark -->
    <a routerLink="/" class="brand-link flex items-center gap-2.5" aria-label="FlipSocial Follower Counter Home">
      <div class="brand-mark-box">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="20" height="20" rx="5.5" stroke="white" stroke-width="2"/>
          <circle cx="12" cy="12" r="4.2" stroke="white" stroke-width="2"/>
          <circle cx="17.2" cy="6.8" r="1.2" fill="white"/>
        </svg>
      </div>
      <div class="brand-naming">
        <span class="brand-wordmark font-heading">
          Flip<span class="brand-accent">Social</span>
        </span>
        <span class="brand-tagline font-mono">MECHANICAL COUNTER</span>
      </div>
    </a>

    <!-- Desktop Nav Links -->
    <nav class="desktop-nav flex items-center gap-6" aria-label="Product Navigation">
      <button type="button" (click)="scrollToSection('products')" class="nav-link-btn">Products</button>
      <button type="button" (click)="scrollToSection('how-it-works')" class="nav-link-btn">How It Works</button>
      <button type="button" (click)="scrollToSection('why-business')" class="nav-link-btn">For Business</button>
      <button type="button" (click)="scrollToSection('specifications')" class="nav-link-btn">Specifications</button>
      <button type="button" (click)="scrollToSection('faq')" class="nav-link-btn">FAQ</button>
    </nav>

    <!-- Desktop CTA Group -->
    <div class="desktop-actions flex items-center gap-3">
      <button type="button" (click)="navigateToLogin()" class="btn-login-link">
        Sign In
      </button>

      <button
        type="button"
        (click)="scrollToSection('get-yours')"
        class="btn-get-counter font-heading"
      >
        <span>Get Your Counter</span>
        <span class="btn-arrow" aria-hidden="true">→</span>
      </button>

      <!-- Mobile Hamburger Button -->
      <button
        type="button"
        class="mobile-toggle-btn"
        (click)="toggleMobileMenu()"
        [attr.aria-expanded]="mobileMenuOpen"
        aria-label="Toggle Navigation Menu"
      >
        @if (mobileMenuOpen) {
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        } @else {
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <line x1="4" y1="6" x2="20" y2="6"></line>
            <line x1="4" y1="12" x2="20" y2="12"></line>
            <line x1="4" y1="18" x2="20" y2="18"></line>
          </svg>
        }
      </button>
    </div>
  </div>

  <!-- Mobile Collapsible Menu -->
  @if (mobileMenuOpen) {
    <div class="mobile-menu-drawer" role="navigation" aria-label="Mobile Navigation">
      <div class="mobile-drawer-inner flex flex-col gap-2 p-4">
        <button type="button" (click)="scrollToSection('products')" class="mobile-nav-link">Products</button>
        <button type="button" (click)="scrollToSection('how-it-works')" class="mobile-nav-link">How It Works</button>
        <button type="button" (click)="scrollToSection('why-business')" class="mobile-nav-link">For Business</button>
        <button type="button" (click)="scrollToSection('specifications')" class="mobile-nav-link">Specifications</button>
        <button type="button" (click)="scrollToSection('faq')" class="mobile-nav-link">FAQ</button>

        <div class="mobile-actions-group flex flex-col gap-2.5 pt-3 mt-2 border-t border-subtle">
          <button type="button" (click)="navigateToLogin()" class="btn btn-secondary w-full">Sign In to Dashboard</button>
          <button type="button" (click)="scrollToSection('get-yours')" class="btn btn-primary w-full">Get Your Counter</button>
        </div>
      </div>
    </div>
  }
</header>
